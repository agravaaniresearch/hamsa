<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hamsa digest</title>
  <script src="../shared/theme-init.js"></script>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="digest.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="https://news.ycombinator.com/news"><img src="../icons/icon-48.png" alt="" width="24" height="24"> Hamsa</a>
    <span class="sub">Morning digest</span>
    <span class="grow"></span>
    <span id="usage" class="pill" title="Tokens your keys used today"></span>
    <button id="btn-theme" class="icon" type="button" title="Theme: Auto" aria-label="Theme: Auto"></button>
    <button id="btn-settings" class="icon" type="button" title="Hamsa settings" aria-label="Hamsa settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg>
    </button>
  </header>
  <main class="page">
    <h1 id="title">Digest</h1>
    <p id="lede" class="lede"></p>
    <div class="row">
      <button id="btn-rebuild" class="secondary" type="button">Rebuild now</button>
      <a class="secondary btnlink" href="https://news.ycombinator.com/news">Open the filtered front page</a>
      <label class="check"><input id="show-maybe" type="checkbox"> Include maybe</label>
    </div>
    <div id="clusters" class="clusters" aria-live="polite"></div>
    <p class="lede small" id="foot"></p>
  </main>
  <script type="module" src="digest.js"></script>
</body>
</html>
