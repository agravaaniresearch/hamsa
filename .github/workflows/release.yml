name: Test, and sign on request

# Every push: tests and the add-on linter.
# Run by hand (Actions → "Test, and sign on request" → Run workflow): signs the version in
# extension/manifest.json with Mozilla (unlisted), commits releases/hamsa-<version>.xpi and updates.json,
# and that commit publishes the GitHub release (publish-release.yml). Needs the repository secrets
# AMO_JWT_ISSUER and AMO_JWT_SECRET. Signing on your own computer works the same way: see DEPLOY.md.
on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint

  sign:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sign with Mozilla and write updates.json
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then echo "::error::Add the AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets first."; exit 1; fi
          node scripts/release.mjs
      - name: Commit the signed build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/*.xpi updates.json
          git commit -m "Signed build $(jq -r .version extension/manifest.json)"
          git push

  publish:
    needs: sign
    uses: ./.github/workflows/publish-release.yml
